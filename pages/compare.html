<!DOCTYPE html>
<html lang="en" data-base="..">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MediFind is a CSE326 health facility resource directory for comparing clinics, labs, pharmacies and support facilities.">
  <meta name="theme-color" content="#050914">

  <title>Compare facilities · MediFind</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header" data-site-header></header>
  <main class="main" id="main">
    <section class="page-hero"><div class="container"><span class="kicker">Side-by-side view</span><h1 class="gradient-text">Compare facilities</h1><p>Keep the decision focused by comparing up to three facilities across status, verification, ratings, services and contact details.</p></div></section>
    <section class="section-tight"><div class="container">
      <div class="compare-controls"><select id="compare-picker" aria-label="Add a facility to compare"><option value="">Loading…</option></select><span class="category-chip" data-compare-limit>0/3 selected</span><button class="btn btn-ghost" type="button" data-clear-compare>Clear comparison</button></div>
      <div data-compare-root></div>
    </div></section>
  </main>
  <footer class="site-footer" data-site-footer></footer>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/compare.js"></script>
</body>
</html>
